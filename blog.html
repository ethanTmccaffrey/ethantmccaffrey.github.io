<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethan McCaffrey - Blog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Rubik:wght@400;500;600;700&family=Rubik+Mono+One&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">

<style>
:root{ --gold:#e6b34a; --hand:"Caveat",cursive; --mono:"Rubik Mono One",monospace; }

.board{margin-top:34px;border-radius:8px;padding:clamp(16px,2.2vw,26px);
  background:linear-gradient(160deg,var(--wood-lite),var(--wood) 45%,var(--wood-dark));
  border:3px solid var(--ink);box-shadow:7px 12px 0 var(--ink), inset 0 0 0 3px #ffffff22;}
.cork{position:relative;border-radius:4px;border:3px solid #00000055;padding:clamp(24px,4vw,46px) clamp(18px,3vw,34px) clamp(40px,5vw,60px);
  background:#c69e5c url("images/cork.png");background-size:320px;
  box-shadow:inset 0 0 40px #00000055, inset 0 0 0 2px #ffffff14;}

.flyer{position:relative;width:min(470px,90%);margin:6px auto 44px;background:var(--gold);
  border:3px solid var(--ink);box-shadow:4px 8px 16px #00000055;transform:rotate(-1.4deg);}
.flyer-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 16px;border-bottom:3px solid var(--ink);
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;}
.flyer-name{padding:14px 18px 18px;text-align:center;}
.flyer-name h2{font-family:var(--display);font-size:clamp(2.3rem,6.5vw,3.4rem);line-height:.85;color:var(--ink);}
.flyer-name p{font-family:var(--text);font-weight:600;font-size:.8rem;margin:.5rem 0 0;}
.flyer .tape{position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-2deg);width:96px;height:26px;z-index:2;
  background:#e7cf8bcc;border:1px dashed #33210f33;box-shadow:0 1px 2px #00000022;}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:clamp(26px,3vw,40px) clamp(22px,2.6vw,34px);}
.note{position:relative;display:block;text-decoration:none;color:var(--ink);background:#fbf3dd;
  border:1px solid #00000018;box-shadow:3px 7px 14px #00000048;padding:20px 18px 18px;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);}
.note:nth-child(3n+1){transform:rotate(-2deg);}
.note:nth-child(3n+2){transform:rotate(1.5deg);}
.note:nth-child(3n+3){transform:rotate(-.6deg);}
.note:hover{transform:rotate(0) translateY(-4px);box-shadow:5px 12px 20px #00000055;z-index:2;}
.pin{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff8, transparent 45%), var(--accent);
  border:1px solid #00000055;box-shadow:0 3px 4px #00000055;}
.note:nth-child(3n+2) .pin{background:radial-gradient(circle at 35% 30%, #fff8, transparent 45%), var(--teal, #2f7d8a);}
.note:nth-child(3n+3) .pin{background:radial-gradient(circle at 35% 30%, #fff8, transparent 45%), var(--gold);}
.note .date{font-family:var(--mono);font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;color:var(--wood-dark);}
.note h3{font-family:var(--display);font-size:1.35rem;line-height:1.02;margin:.5rem 0 .5rem;}
.note .stand{font-size:.92rem;line-height:1.45;opacity:.9;}
.note .tags{margin-top:.8rem;display:flex;flex-wrap:wrap;gap:6px;}
.note .tags span{font-family:var(--text);font-weight:600;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;
  border:1.5px solid var(--ink);border-radius:100px;padding:2px 9px;}
.note .rt{font-family:var(--hand);font-size:1.1rem;color:var(--accent);position:absolute;right:14px;bottom:8px;transform:rotate(-4deg);}

.blog-state{text-align:center;padding:44px 20px;font-size:1.05rem;line-height:1.6;color:var(--paper);text-shadow:1px 1px 0 #0006;}
.blog-state code{background:#0004;padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:.85em;}
.blog-state a{color:#fff;font-weight:700;}

.back-link{display:inline-flex;align-items:center;gap:7px;margin:0 auto 22px;background:var(--paper);border:2px solid var(--ink);
  color:var(--ink);border-radius:100px;padding:7px 16px;font-family:var(--text);font-weight:600;font-size:.82rem;text-decoration:none;cursor:pointer;
  box-shadow:2px 3px 0 var(--ink);}
.back-link:hover{background:var(--ink);color:var(--paper);}
.sheet{position:relative;max-width:760px;margin:0 auto;background:#fbf3dd;border:1px solid #00000018;
  box-shadow:4px 12px 26px #00000066;padding:38px clamp(22px,4vw,50px) 44px;}
.sheet .pin{top:-13px;width:22px;height:22px;}
.sheet .kicker{font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--wood-dark);}
.sheet h1{font-family:var(--display);font-size:clamp(2rem,5vw,3rem);line-height:1;margin:.4rem 0 1rem;}
.sheet .a-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.4rem;}
.sheet .a-tags span{font-family:var(--text);font-weight:600;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);border-radius:100px;padding:3px 11px;}
.article-body{font-size:1.05rem;line-height:1.66;}
.article-body h1,.article-body h2,.article-body h3{font-family:var(--display);line-height:1.05;margin:1.6rem 0 .6rem;}
.article-body h2{font-size:1.5rem;} .article-body h3{font-size:1.2rem;}
.article-body p{margin:0 0 1rem;}
.article-body a{color:var(--accent);}
.article-body img{max-width:100%;height:auto;border:3px solid var(--ink);border-radius:4px;}
.article-body pre{background:var(--ink);color:var(--paper);padding:14px 16px;border-radius:6px;overflow:auto;font-size:.9rem;}
.article-body code{font-family:var(--mono);font-size:.86em;}
.article-body pre code{background:none;}
.article-body blockquote{border-left:4px solid var(--accent);margin:1rem 0;padding:.2rem 0 .2rem 16px;opacity:.9;}
.wrap-narrow{padding-top:6px;}
</style>
</head>
<body>
<canvas id="wall"></canvas>
<div id="wall-tint"></div>
<div class="grain"></div>

<div class="wrap">
    <header class="masthead">
        <div class="sunburst"></div>
        <div class="brand">
            <p class="eyebrow">Games Programmer</p>
            <h1>Ethan<br>McCaffrey</h1>
        </div>
        <div class="contact">
            <nav class="nav">
                <a href="index.html" class="nav-link">Work</a>
                <a href="blog.html" class="nav-link is-current">Blog</a>
                <a href="cv.html" class="nav-link">CV</a>
            </nav>
            <a href="https://github.com/ethantmccaffrey" target="_blank" rel="noopener">github.com/ethantmccaffrey</a>
            <a href="mailto:ethanmccaffrey2003@gmail.com">ethanmccaffrey2003@gmail.com</a>
        </div>
    </header>

    <div class="board">
        <div class="cork">
            <div class="flyer">
                <span class="tape"></span>
                <div class="flyer-top"><span>Dev Dispatch</span><span>Est. 2026</span></div>
                <div class="flyer-name">
                    <h2>B-Sides</h2>
                    <p>Dev logs &amp; breakdowns from the workshop</p>
                </div>
            </div>

            <div id="blog-view">
                <div class="blog-state">Loading posts&hellip;</div>
            </div>
        </div>
    </div>
</div>

<script>
    const wall = document.getElementById("wall");
    const wx = wall.getContext("2d");
    const STRIPES = ["#e6b34a", "#9bb06a", "#2f7d8a", "#df6a2e", "#efdcb0", "#e59a4c", "#c14a2b"];
    function drawWall() {
        const W = wall.width = innerWidth, H = wall.height = innerHeight;
        const sw = Math.max(46, W / 16), amp = sw * 0.85, k = 6.283 / (H / 2.3);
        for (let y = 0; y < H; y += 3) {
            const off = Math.sin(y * k) * amp;
            for (let i = -3; i * sw < W + sw + amp; i++) {
                wx.fillStyle = STRIPES[((i % STRIPES.length) + STRIPES.length) % STRIPES.length];
                wx.fillRect(i * sw + off, y, sw + 1, 4);
            }
        }
    }
    drawWall(); addEventListener("resize", drawWall);
</script>
<script src="blog.js"></script>
</body>
</html>
